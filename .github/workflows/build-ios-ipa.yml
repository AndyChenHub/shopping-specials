name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'scripts/**'
      - '.github/workflows/build-ios-ipa.yml'

permissions:
  contents: write

concurrency:
  group: build-ios-ipa
  cancel-in-progress: false

jobs:
  build-ipa:
    name: Build & Release Versioned iOS .ipa
    runs-on: macos-latest
    timeout-minutes: 45
    if: "!contains(github.event.head_commit.message || '', '[skip ci]')"

    steps:
      - name: Checkout repository with full history & tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Prepare next semantic version & build number
        id: ver
        run: |
          git fetch --tags --force
          node app/scripts/prepare-release-version.mjs

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type-check TypeScript
        working-directory: app
        run: npx tsc --noEmit

      - name: Build native iOS Release .ipa
        working-directory: app
        env:
          IPA_FILENAME: ${{ steps.ver.outputs.ipa_filename }}
        run: bash scripts/build-ipa.sh

      - name: Upload Versioned .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ format('AussieSpecials-{0}-b{1}', steps.ver.outputs.tag_name, steps.ver.outputs.build_number) }}
          path: |
            app/${{ steps.ver.outputs.ipa_filename }}
            app/${{ steps.ver.outputs.ipa_filename }}.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Commit version bump & publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build_number }}
          TAG_NAME: ${{ steps.ver.outputs.tag_name }}
          IPA_FILENAME: ${{ steps.ver.outputs.ipa_filename }}
          GIT_SHA: ${{ steps.ver.outputs.git_sha }}
        run: bash app/scripts/publish-github-release.sh
