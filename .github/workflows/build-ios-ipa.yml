name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/build-ios-ipa.yml'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build Unsigned iOS .ipa (macOS + Xcode)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Check Xcode version
        run: xcodebuild -version

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Type-check TypeScript
        working-directory: app
        run: npx tsc --noEmit

      - name: Build native iOS Release .ipa
        working-directory: app
        run: bash scripts/build-ipa.sh

      - name: Upload AussieSpecials.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AussieSpecials-iOS-ipa
          path: app/AussieSpecials.ipa
          if-no-files-found: error
          retention-days: 30

      - name: Attach .ipa to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.event.release.tag_name }}" app/AussieSpecials.ipa --clobber
